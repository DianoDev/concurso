services:
    composer-install:
        container_name: sic-composer-install
        image: composer:2.8.3
        restart: on-failure
        volumes:
            - '.:/app'
        working_dir: /app
        command: composer update --ignore-platform-req=ext-oci8
        networks:
            - sic_network

    npm-install:
        container_name: sic-npm-install
        image: node:20.14.0
        restart: on-failure
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command: npm install
        networks:
            - sic_network

    fpm:
        container_name: sic-fpm
        build:
            context: .
            dockerfile: .docker/php-fpm/Dockerfile.local
        image: sic/fpm
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        environment:
            WWWUSER: '1000'
            XDEBUG_MODE: 'develop,debug'
            XDEBUG_CONFIG: 'client_host=host.docker.internal'
        volumes:
            - '.:/var/www/html'
        networks:
            - sic_network
        depends_on:
            composer-install:
                condition: service_completed_successfully

    nginx:
        container_name: sic-nginx
        image: sic/nginx
        restart: unless-stopped
        build:
            context: .
            dockerfile: .docker/nginx/Dockerfile.local
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "${APP_PORT}:80"
        volumes:
            - '.:/var/www/html'
        networks:
            - sic_network
        depends_on:
            fpm:
                condition: service_started

    mix:
        container_name: sic-mix
        image: node:20.14.0
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '5173:5173'
        volumes:
            - '.:/var/www/html'
        working_dir: /var/www/html
        command: npm run dev
        networks:
            - sic_network
        depends_on:
            npm-install:
                condition: service_completed_successfully

networks:
    sic_network:
        driver: bridge

